<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Ether Velocity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#712ae2",
                      "on-surface": "#1a1c1c",
                      "surface-container-lowest": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-container": "#eeeeee",
                      "inverse-surface": "#2f3131",
                      "surface-dim": "#dadada",
                      "secondary": "#0051d5",
                      "on-tertiary-fixed": "#340042",
                      "background": "#f9f9f9",
                      "tertiary-fixed": "#fcd6ff",
                      "on-tertiary-fixed-variant": "#682f76",
                      "on-secondary-fixed": "#00174b",
                      "on-surface-variant": "#464554",
                      "on-error": "#ffffff",
                      "tertiary-fixed-dim": "#f3aeff",
                      "on-error-container": "#93000a",
                      "outline": "#767586",
                      "inverse-on-surface": "#f0f1f1",
                      "secondary-fixed-dim": "#b4c5ff",
                      "secondary-container": "#316bf3",
                      "on-secondary": "#ffffff",
                      "error": "#ba1a1a",
                      "inverse-primary": "#d2bbff",
                      "on-secondary-fixed-variant": "#003ea8",
                      "on-secondary-container": "#fefcff",
                      "on-primary-fixed": "#25005a",
                      "tertiary-container": "#9a5da8",
                      "on-tertiary-container": "#fffbff",
                      "tertiary": "#7f458d",
                      "on-primary-container": "#fffbff",
                      "outline-variant": "#c7c4d7",
                      "primary-fixed-dim": "#d2bbff",
                      "surface": "#f9f9f9",
                      "primary-fixed": "#eaddff",
                      "primary-container": "#8a4cfc",
                      "surface-tint": "#732ee4",
                      "surface-container-highest": "#e2e2e2",
                      "surface-bright": "#f9f9f9",
                      "on-primary-fixed-variant": "#5a00c6",
                      "surface-container-high": "#e8e8e8",
                      "surface-variant": "#e2e2e2",
                      "surface-container-low": "#f3f3f4",
                      "error-container": "#ffdad6",
                      "secondary-fixed": "#dbe1ff",
                      "on-tertiary": "#ffffff",
                      "on-background": "#1a1c1c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Manrope"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col">
<!-- Header with minimalist language switcher -->
<header class="fixed top-0 w-full flex justify-end items-center h-20 px-8 z-50">
<button class="flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-surface-container transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant text-xl">language</span>
<span class="text-sm font-semibold text-on-surface-variant">English</span>
</button>
</header>
<main class="flex-grow flex items-center justify-center relative overflow-hidden px-6 py-12">
<!-- Asymmetrical Background Element -->
<div class="absolute top-[-10%] right-[-10%] w-[60%] h-[80%] rounded-full opacity-20 blur-[120px] bg-gradient-to-br from-primary to-secondary pointer-events-none"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[60%] rounded-full opacity-10 blur-[100px] bg-primary pointer-events-none"></div>
<div class="w-full max-w-[480px] relative z-10">
<!-- Central Card with Tonal Layering -->
<div class="bg-surface-container-lowest rounded-xl p-10 shadow-[0_40px_80px_-15px_rgba(113,42,226,0.08)] border border-outline-variant/10">
<div class="mb-10 text-left">
<div class="font-headline text-xl font-black text-[#1A1C1C] tracking-tight mb-8">Ether Velocity</div>
<h1 class="font-headline text-4xl font-extrabold text-on-surface tracking-tight mb-3">Welcome back</h1>
<p class="text-on-surface-variant text-lg">Secure access to your digital velocity.</p>
</div>
<form class="space-y-6">
<div>
<label class="block text-sm font-semibold text-on-surface-variant mb-2 ml-1" for="email">Email address</label>
<input class="w-full px-5 py-4 bg-surface-container-low border-0 rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2 ml-1">
<label class="text-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<input class="w-full px-5 py-4 bg-surface-container-low border-0 rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center space-x-3 ml-1">
<div class="relative flex items-center">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all cursor-pointer" id="remember" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant font-medium cursor-pointer" for="remember">Remember this device</label>
</div>
<button class="w-full py-4 px-6 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-full shadow-lg shadow-primary/20 hover:shadow-primary/30 transition-all duration-300 transform active:scale-95 flex justify-center items-center gap-2 group" type="submit">
                        Login
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-8 border-t border-outline-variant/15">
<div class="text-center mb-6">
<span class="text-xs font-bold text-outline tracking-widest uppercase">Passwordless Access</span>
</div>
<button class="w-full flex items-center justify-center gap-3 py-4 px-6 bg-surface-container-low hover:bg-surface-container-high text-on-surface font-semibold rounded-lg transition-all duration-300 group" type="button">
<span class="material-symbols-outlined text-primary" data-icon="fingerprint" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                        Login with WebAuthn
                    </button>
</div>
</div>
<!-- Contextual Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm font-medium">
                    New to Ether Velocity? <a class="text-primary font-bold hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
</main>
</div>
</div>
</body></html>
